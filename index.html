<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdvikMart - Vendor Signup</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    h2 { color: #e63946; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { background: #e63946; color: white; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>AdvikMart Vendor Signup</h2>
    <input type="text" placeholder="Shop Name" id="shop">
    <input type="text" placeholder="Your Name" id="name">
    <input type="number" placeholder="Mobile Number" id="mobile">
    <input type="text" placeholder="Address" id="address">
    <button onclick="alert('Form Submitted!')">Submit</button>
  </div>
</body>
</html>
