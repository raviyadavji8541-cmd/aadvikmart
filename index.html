<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdvikMart Vendor Signup</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Arial', sans-serif; 
      background: linear-gradient(135deg, #ff6b6b, #d32f2f); 
      padding: 20px; 
      margin: 0;
    }
    .container { 
      max-width: 650px; 
      margin: 20px auto; 
      background: white; 
      padding: 30px; 
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    }
    h2 { 
      text-align: center; 
      color: #d32f2f; 
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    input, select { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      font-size: 15px;
      transition: border 0.3s;
    }
    input:focus, select:focus {
      border-color: #d32f2f;
      outline: none;
    }
    button { 
      background: #d32f2f; 
      color: white; 
      padding: 14px; 
      border: none; 
      width: 100%; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: bold;
      cursor: pointer; 
      margin-top: 15px;
      transition: background 0.3s;
    }
    button:hover { 
      background: #b71c1c; 
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #msg { 
      text-align: center; 
      margin-top: 15px; 
      font-weight: bold;
      font-size: 16px;
    }
    .required { color: red; }
  </style>
</head>
<body>
<div class="container">
  <h2>AdvikMart Vendor Signup</h2>
  <p class="subtitle">Join our marketplace and grow your business</p>
  
  <form id="vendorForm">
    <input type="text" name="shop" placeholder="Shop Name *" required>
    <input type="text" name="name" placeholder="Owner Name *" required>
    <input type="tel" name="mobile" placeholder="Mobile Number *" required pattern="[0-9]{10}">
    <input type="tel" name="whatsapp" placeholder="WhatsApp Number">
    <input type="email" name="email" placeholder="Email Address">
    <input type="text" name="address" placeholder="Shop Address">
    <input type="text" name="city" placeholder="City">
    <input type="text" name="pincode" placeholder="Pincode" pattern="[0-9]{6}">
    
    <select name="category" required>
      <option value="">Select Product Category *</option>
      <option>Kirana / Grocery</option>
      <option>Garments / Clothing</option>
      <option>Electronics</option>
      <option>Mobile & Accessories</option>
      <option>Cosmetics</option>
      <option>Stationery</option>
      <option>Other</option>
    </select>
    
    <input type="text" name="gst" placeholder="GST Number (Optional)">
    
    <button type="submit" id="submitBtn">Submit Application</button>
  </form>
  
  <p id="msg"></p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLj0fdciYBXFqe-JsE0lyIrAhpSOUZK9Qp1HqKB0Wdyxgdqekk_MZS3d7RfxS4XFc4/exec";

const form = document.getElementById("vendorForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", e => {
  e.preventDefault();
  
  btn.disabled = true;
  btn.innerText = "Submitting...";
  msg.style.color = "blue";
  msg.innerText = "Submitting... Please wait";
  
  let formData = new FormData(form);
  let data = Object.fromEntries(formData);
  
  fetch(SCRIPT_URL, {
  method: "POST",
  mode: "no-cors" // <-- YE LINE ADD KAR
  body: JSON.stringify(formData)
})
  .then(() => {
    // no-cors me response nahi aata, isliye direct success maan lete hain
    msg.style.color = "green";
    msg.innerText = "✅ Form Submitted Successfully!";
    form.reset();
  })
  .catch(err => {
    msg.style.color = "red";
    msg.innerText = "❌ Error! Please try again.";
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Submit Application";
  });
});
</script>
</body>
</html>
