<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdvikMart - Vendor Registration</title>
<style>
  body{font-family:Arial; background:#f5f5f5; padding:20px}
  .container{max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px #ccc}
  h2{text-align:center; color:#2c3e50}
  input, select, textarea{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px; box-sizing:border-box}
  button{width:100%; padding:12px; background:#27ae60; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer}
  button:hover{background:#219150}
  .success{display:none; color:green; text-align:center; padding:10px; background:#d4edda; border-radius:5px; margin-top:10px}
</style>
</head>
<body>

<div class="container">
  <h2>AdvikMart Vendor Registration</h2>
  <form id="vendorForm">
    <input type="text" id="shop" placeholder="Shop Name *" required>
    <input type="text" id="name" placeholder="Owner Name *" required>
    <input type="tel" id="mobile" placeholder="Mobile Number *" required>
    <input type="tel" id="whatsapp" placeholder="Whatsapp Number">
    <input type="email" id="email" placeholder="Email">
    <textarea id="address" placeholder="Shop Address"></textarea>
    <input type="text" id="city" placeholder="City *" required>
    <input type="text" id="pincode" placeholder="Pincode">
    <select id="category">
      <option value="">Select Category</option>
      <option>Grocery</option>
      <option>Clothes</option>
      <option>Electronics</option>
      <option>Food</option>
      <option>Other</option>
    </select>
    <input type="text" id="gst" placeholder="GST Number">
    <button type="submit">Submit Vendor Details</button>
  </form>
  <div class="success" id="msg">✅ Form submit ho gaya! Hum 24 ghante me contact karenge.</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVHJ-5YcBTeYFxq5mZHzgKvV1pdr3h6-sGVBd6R6T6NRZTmb915_o_gPe2hhZlEQbo/exec"; // <-- STEP 1: YAHAN URL DAAL

document.getElementById("vendorForm").addEventListener("submit", function(e){
  e.preventDefault();

  let formData = {
    shop: document.getElementById("shop").value,
    name: document.getElementById("name").value,
    mobile: document.getElementById("mobile").value,
    whatsapp: document.getElementById("whatsapp").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    city: document.getElementById("city").value,
    pincode: document.getElementById("pincode").value,
    category: document.getElementById("category").value,
    gst: document.getElementById("gst").value
  };

  // Data bhejne ka kaam
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors", // CORS error hatane ke liye
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(formData)
  });

  // Turant success dikha do
  document.getElementById("msg").style.display = "block";
  document.getElementById("vendorForm").reset(); // form khali

  setTimeout(() => {
    document.getElementById("msg").style.display = "none";
  }, 4000);
});
</script>

</body>
</html>
