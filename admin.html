<!DOCTYPE html>
<html>
<head>
<title>AdvikMart Admin Panel</title>
<style>
body{font-family:Arial; background:#f5f5f5; padding:20px;}
.container{max-width:1200px; margin:auto; background:white; padding:20px; border-radius:10px;}
h2{color:#d32f2f; text-align:center;}
table{width:100%; border-collapse:collapse; margin-top:20px;}
th,td{border:1px solid #ddd; padding:10px; text-align:left; font-size:14px;}
th{background:#d32f2f; color:white;}
tr:nth-child(even){background:#f9f9f9;}
.btn{padding:5px 10px; border:none; border-radius:5px; cursor:pointer;}
.approve{background:green; color:white;}
.reject{background:red; color:white;}
</style>
</head>
<body>
<div class="container">
<h2>AdvikMart Vendor List</h2>
<div id="loading">Loading...</div>
<table id="vendorTable" style="display:none;">
<thead>
<tr>
<th>Timestamp</th><th>Shop</th><th>Name</th><th>Mobile</th>
<th>City</th><th>Category</th><th>Status</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVHJ-5YcBTeYFxq5mZHzgKvV1pdr3h6-sGVBd6R6T6NRZTmb915_o_gPe2hhZlEQbo/exec";

fetch(SCRIPT_URL, {
  method: "POST",
  mode: "no-cors" // <-- YE LINE ADD KAR
  body: JSON.stringify(formData)
})
.then(res => res.json())
.then(data => {
  document.getElementById("loading").style.display = "none";
  document.getElementById("vendorTable").style.display = "table";
  
  let rows = "";
  data.forEach(row => {
    rows += `<tr>
      <td>${row.Timestamp}</td>
      <td>${row.Shop}</td>
      <td>${row.Name}</td>
      <td>${row.Mobile}</td>
      <td>${row.City}</td>
      <td>${row.Category}</td>
      <td>Pending</td>
    </tr>`;
  });
  document.getElementById("tableBody").innerHTML = rows;
})
.catch(err => {
  document.getElementById("loading").innerText = "Error loading data";
});
</script>
</body>
</html>
